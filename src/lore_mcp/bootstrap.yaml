# lore-mcp configuration
# Generated by: lore-mcp init
# All values shown are defaults. Uncomment to override.
# Without this file, lore-mcp works with XDG defaults.
# Docs: docs/configuration.md

# === Database ===

# Common: base directory for all collections
# database:
#   dir: ~/.local/share/lore-mcp/
#   default_collection: default

# === Embedding ===

# Common: model name (references llm registry entry below)
# embedding:
#   model: nomic-embed

# Advanced
#   mode: api              # api | builtin:gpu | builtin:cpu

# === Chunking ===

# Common
# chunking:
#   size: 1024

# Advanced
#   overlap: 128

# === Search ===

# Common
# search:
#   top_k: 5

# Advanced
#   reranking_model: ""     # llm registry entry name, empty = no reranking
#   mmr: false              # Maximal Marginal Relevance for diversity
#   window_size: 0          # adjacent chunk expansion, 0 = disabled
#   max_per_source: 0       # max chunks per source, 0 = no limit

# === add_source defaults ===

# Common
# add_source:
#   preprocess: true

# Advanced
#   enrich: []              # [context, qa, meta]
#   optimize: false

# === Enrichment ===

# Advanced
# enrich:
#   techniques: []          # [context, qa, meta, stt_correction]
#   models: []              # llm registry entry names
#   prompts_file: ""        # custom prompts.yaml path

# === Parse ===

# Advanced
# parse:
#   ocr_engine: ""          # tesseract | ""
#   ocr_lang: []            # [eng, fra]
#   stt_model: ""           # llm registry entry name
#   video_frame_strategy: scene  # scene | fixed | hybrid | ocr
#   frame_interval: 30      # seconds between frames (fixed/hybrid)
#   scene_threshold: 0.3    # scene change sensitivity

# === LLM Registry ===

# Define inference services. Referenced by name in other sections.
# llm:
#   - name: nomic-embed
#     model: nomic-ai/nomic-embed-text-v2-moe
#     api_url: http://127.0.0.1:8082/v1/embeddings
#     resource: local_gpu   # local_gpu | local_cpu | remote
#
#     # Advanced service lifecycle
#     # start: podman run ...
#     # stop: podman stop ...
#     # start_timeout: 120
#     # timeout: 180
#     # concurrency: 1
#     # batch_size: 32
#     # verify_ssl: true
